name: Build libcheat.dylib

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Clone Dobby
        run: |
          git clone --depth 1 --recursive https://github.com/jmpews/Dobby.git third_party/dobby

      - name: Build Dobby for iOS arm64
        run: |
          cd third_party/dobby
          # Используем официальный скрипт сборки Dobby для iOS
          python3 scripts/platform_builder.py --platform=iphoneos --arch=arm64
          
          echo "=== Built artifacts ==="
          # Ищем собранную статическую библиотеку для arm64
          find . -name "libdobby.a" -exec lipo -info {} \;

      - name: Build libcheat.dylib
        run: bash scripts/build.sh

      - name: Verify dylib
        run: |
          echo "=== file ==="
          file build/libcheat.dylib
          echo "=== linked libraries ==="
          otool -L build/libcheat.dylib
          echo "=== LC_ID_DYLIB ==="
          otool -l build/libcheat.dylib | grep -A2 LC_ID_DYLIB

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libcheat-dylib
          path: build/libcheat.dylib
